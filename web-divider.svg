<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 44" width="800" height="44" role="img" aria-label="A spider dangling from a web thread" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E62429" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#E62429"/>
      <stop offset="0.75" stop-color="#2450B8"/>
      <stop offset="1" stop-color="#2450B8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- horizontal web thread -->
  <rect x="0" y="33" width="800" height="2" rx="1" fill="url(#thread)"/>

  <!-- light shimmering along the thread -->
  <circle r="2.5" cy="34" fill="#FFFFFF" opacity="0.85">
    <animate attributeName="cx" values="60;740;60" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>

  <!-- hanging thread (lengthens and shortens with the spider) -->
  <line x1="400" y1="0" x2="400" y2="4" stroke="#9AA4B2" stroke-width="1">
    <animate attributeName="y2" values="4;13;4" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </line>

  <!-- spider -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="400 11;400 20;400 11"
                      keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>

    <!-- legs: left side, mirrored for the right -->
    <g stroke="#E62429" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g>
        <path d="M-3 -4 L-9 -9 L-12 -6"/>
        <path d="M-4 -1 L-12 -3 L-14 1"/>
        <path d="M-4 3 L-12 6 L-13 9"/>
        <path d="M-3 6 L-7 9 L-6 11"/>
      </g>
      <g transform="scale(-1 1)">
        <path d="M-3 -4 L-9 -9 L-12 -6"/>
        <path d="M-4 -1 L-12 -3 L-14 1"/>
        <path d="M-4 3 L-12 6 L-13 9"/>
        <path d="M-3 6 L-7 9 L-6 11"/>
      </g>
    </g>

    <!-- body -->
    <ellipse cx="0" cy="3" rx="5" ry="5.5" fill="#E62429"/>
    <path d="M0 -0.5 L2 3 L0 6.5 L-2 3 Z" fill="#2450B8"/>
    <circle cx="0" cy="-4" r="3.6" fill="#E62429"/>
    <circle cx="-1.5" cy="-4.4" r="0.9" fill="#FFFFFF"/>
    <circle cx="1.5" cy="-4.4" r="0.9" fill="#FFFFFF"/>
  </g>
</svg>
