<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64">

  <defs>

    <!-- Red-dominant RGB gradient -->
    <linearGradient
      id="portfolioGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%"   stop-color="#ff0000"/>
      <stop offset="25%"  stop-color="#ff1744"/>
      <stop offset="50%"  stop-color="#8a00ff"/>
      <stop offset="72%"  stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Glow -->
  <rect
    x="5"
    y="5"
    width="230"
    height="54"
    rx="16"
    fill="url(#portfolioGradient)"
    opacity="0.45"
    filter="url(#glow)"
  />


  <!-- Main button -->
  <rect
    x="3"
    y="3"
    width="234"
    height="58"
    rx="16"
    fill="url(#portfolioGradient)"
  />


  <!-- Dark translucent overlay -->
  <rect
    x="7"
    y="7"
    width="226"
    height="50"
    rx="12"
    fill="#000000"
    opacity="0.20"
  />


  <!-- Subtle highlight -->
  <rect
    x="8"
    y="8"
    width="224"
    height="20"
    rx="10"
    fill="#ffffff"
    opacity="0.08"
  />


  <!-- Button text -->
  <text
    x="120"
    y="39"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="700"
    letter-spacing="1"
    fill="#ffffff"
  >
    VISIT MY PORTFOLIO
  </text>

</svg>
