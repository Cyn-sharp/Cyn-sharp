<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" width="100%" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges" style="display:block;image-rendering:pixelated" role="img" aria-labelledby="t">
  <title id="t">Pixel art eyes blinking</title>
  <style>
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    @keyframes blink {
      0%, 88% { transform: scaleY(1);    animation-timing-function: ease-in; }
      91.5%   { transform: scaleY(0.08); animation-timing-function: linear; }
      95%     { transform: scaleY(0.08); animation-timing-function: ease-out; }
      100%    { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) { .eye { animation: none; } }
  </style>
