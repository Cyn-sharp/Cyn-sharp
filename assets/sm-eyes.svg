<svg
  xmlns="http://www.w3.org/2000/svg"
  width="240"
  height="100"
  viewBox="0 0 240 100"
  shape-rendering="crispEdges"
>
  <style>
    .blink {
      animation: blink 3.5s steps(1, end) infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes blink {
      0%, 88%, 100% {
        transform: scaleY(1);
      }

      90% {
        transform: scaleY(0.65);
      }

      92% {
        transform: scaleY(0.04);
      }

      94% {
        transform: scaleY(0.65);
      }
    }
  </style>

  <rect width="240" height="100" fill="#e00000"/>

  <!-- LEFT EYE -->
  <g class="blink">
    <polygon
      points="
        27,8
        46,14
        69,22
        91,34
        108,48
        91,62
        70,76
        48,84
        34,80
        26,68
        21,48
        20,28
      "
      fill="#000000"
    />

    <polygon
      points="
        39,20
        56,26
        75,33
        91,43
        99,48
        87,57
        71,68
        52,74
        42,69
        35,58
        30,43
        30,28
      "
      fill="#ffffff"
    />
  </g>

  <!-- RIGHT EYE -->
  <g class="blink">
    <polygon
      points="
        213,8
        194,14
        171,22
        149,34
        132,48
        149,62
        170,76
        192,84
        206,80
        214,68
        219,48
        220,28
      "
      fill="#000000"
    />

    <polygon
      points="
        201,20
        184,26
        165,33
        149,43
        141,48
        153,57
        169,68
        188,74
        198,69
        205,58
        210,43
        210,28
      "
      fill="#ffffff"
    />
  </g>

</svg>
